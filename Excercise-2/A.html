<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>HTML Tables</title>
  </head>
  <body>
    <h3><mark>V.VijaySaiDattu|24K61A12C0</mark></h3>
    <h1>HTML Tables Demonstration</h1>
    <h3>Simple Table</h3>
    <table border="1">
      <tr>
        <th>Roll No</th>
        <th>Name</th>
        <th>Marks</th>
      </tr>
      <tr>
        <td>1</td>
        <td>Ravi</td>
        <td>85</td>
      </tr>
      <tr>
        <td>2</td>
        <td>Sita</td>
        <td>90</td>
      </tr>
    </table>

    <h3>Table with rowspan</h3>
    <table border="1">
      <tr>
        <th>Department</th>
        <th>Name</th>
      </tr>
      <tr>
        <td rowspan="2">CSE</td>
        <td>Ravi</td>
      </tr>
      <tr>
        <td>Sita</td>
      </tr>
    </table>

    <h3>Table with colspan</h3>
    <table border="1">
      <tr>
        <th colspan="3">Student Marks</th>
      </tr>
      <tr>
        <td>Maths</td>
        <td>Science</td>
        <td>English</td>
      </tr>
      <tr>
        <td>80</td>
        <td>75</td>
        <td>90</td>
      </tr>
    </table>
  </body>
</html>
