<!DOCTYPE html>
<html>
<head>
    <title>Font and Text Properties</title>

    <style>

        p {
            /* i. Font Size */
            font-size: 25px;

            /* ii. Font Weight */
            font-weight: bold;

            /* iii. Font Style */
            font-style: italic;

            /* iv. Text Decoration */
            text-decoration: underline;

            /* v. Text Transform */
            text-transform: uppercase;

            /* vi. Text Align */
            text-align: center;
        }

    </style>
</head>

<body>
<h3><mark>V.VijaySaiDattu|24K61A12C0</mark></h3>
    <h1>CSS Font and Text Properties</h1>

    <p>
        Welcome to CSS
    </p>

</body>
</html>
