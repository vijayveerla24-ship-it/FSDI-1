<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>CSS Box Model</title>
    <style>
      .box {
        width: 300px;
        height: 100px;
        background-color: lightblue;
        border: 5px solid blue;
        margin: 50px;
        padding: 20px;
      }
    </style>
  </head>
  <body>
    <h1>CSS Box Model</h1>
    <div class="box">Content with border 5px, margin 30px and padding 20px</div>
  </body>
</html>
