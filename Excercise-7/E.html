<!DOCTYPE html>
<html>
<body>

<script>
    let str = "JavaScript";

    document.write("String = " + str + "<br>");
    document.write("Length = " + str.length + "<br>");
    document.write("Uppercase = " + str.toUpperCase() + "<br>");
    document.write("Lowercase = " + str.toLowerCase() + "<br>");
    document.write("Character at 2 = " + str.charAt(2) + "<br>");
    document.write("Substring = " + str.substring(0, 4) + "<br>");
    document.write("Index of Script = " + str.indexOf("Script") + "<br>");
    document.write("Replace = " + str.replace("Java", "Type") + "<br>");
</script>

</body>
</html>
