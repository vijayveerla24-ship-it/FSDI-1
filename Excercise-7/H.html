<!DOCTYPE html>
<html>
<body>

<script>
    class Student {

        constructor(name, age, marks) {
            this.name = name;
            this.age = age;
            this.marks = marks;
        }

        get studentName() {
            return this.name;
        }

        set studentName(name) {
            this.name = name;
        }

        display() {
            document.write("Name: " + this.name + "<br>");
            document.write("Age: " + this.age + "<br>");
            document.write("Marks: " + this.marks + "<br>");
        }
    }

    let s1 = new Student("Vijay", 20, 85);

    s1.display();
</script>

</body>
</html>
