<script>

let fruits = ["Apple", "Banana", "Mango"];

document.write("Array: " + fruits);
document.write("<br>");

document.write("Length: " + fruits.length);
document.write("<br>");

fruits.push("Orange");

document.write("After Push: " + fruits);
document.write("<br>");
fruits.pop();

document.write("After Pop: " + fruits);
document.write("<br>");

fruits.reverse();

document.write("After Reverse: " + fruits);

</script>

</body>
</html>
