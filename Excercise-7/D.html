<!DOCTYPE html>
<html>
<head>
    <title>Math Object</title>
</head>
<body>

<script>
    document.write("PI = " + Math.PI + "<br>");
    document.write("E = " + Math.E + "<br>");
    document.write("Square root of 25 = " + Math.sqrt(25) + "<br>");
    document.write("Power 2^3 = " + Math.pow(2, 3) + "<br>");
    document.write("Absolute value = " + Math.abs(-10) + "<br>");
    document.write("Round 4.6 = " + Math.round(4.6) + "<br>");
    document.write("Floor 4.9 = " + Math.floor(4.9) + "<br>");
    document.write("Ceil 4.1 = " + Math.ceil(4.1) + "<br>");
    document.write("Maximum = " + Math.max(10, 20, 30) + "<br>");
    document.write("Minimum = " + Math.min(10, 20, 30) + "<br>");
</script>

</body>
</html>
