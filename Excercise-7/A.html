<!DOCTYPE html>
<html>

<head>
<title>Document Object</title>
</head>

<body>

<h2 id="demo">Hello</h2>

<script>

document.write("Page Title: " + document.title);
document.write("<br>");

document.write("Page URL: " + document.URL);

document.getElementById("demo").innerHTML =
    "Text changed using Document Object";

</script>

</body>
</html>
