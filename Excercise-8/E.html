<!DOCTYPE html>
<html>
<body>

<script>

let num = Number(prompt("Enter a number:"));
let original = num;
let sum = 0;
let digits = num.toString().length;

while(num > 0) {

    let digit = num % 10;

    sum = sum + Math.pow(digit, digits);

    num = Math.floor(num / 10);
}

if(sum == original) {
    document.write(original + " is an Armstrong number");
}
else {
    document.write(original + " is not an Armstrong number");
}

</script>

</body>
</html>
