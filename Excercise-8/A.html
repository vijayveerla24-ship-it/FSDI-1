<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Largest Number</title>
  </head>
  <body>
    <h1>Largest of Three Numbers</h1>
    <script>
      var a = Number(prompt("Enter first number:"));
      var b = Number(prompt("Enter second number:"));
      var c = Number(prompt("Enter third number:"));
      if (a == b && b == c) {
        alert("Equal numbers");
      } else if (a >= b && a >= c) {
        alert("Largest number is " + a);
      } else if (b >= a && b >= c) {
        alert("Largest number is " + b);
      } else {
        alert("Largest number is " + c);
      }
    </script>
  </body>
</html>
