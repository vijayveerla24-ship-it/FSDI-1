<!DOCTYPE html>
<html>
<head>
<style>
/* Element selector */
p {
    color: blue;
}

/* ID selector */
#heading {
    color: red;
}

/* Class selector */
.box {
    background-color: yellow;
}

/* Group selector */
h2, h3 {
    color: green;
}

/* Universal selector */
* {
    text-align: center;
}
</style>
</head>

<body>
<h3><mark>V.VijaySaiDattu|24K61A12C0</mark></h3>
<h1 id="heading">ID Selector</h1>

<p>Element Selector</p>

<div class="box">Class Selector</div>

<h2>Group Selector</h2>
<h3>Group Selector</h3>

</body>
</html>
