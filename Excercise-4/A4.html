<!DOCTYPE html>
<html>
<head>
<style>

p::first-letter {
    font-size: 40px;
    color: red;
}

p::first-line {
    color: blue;
}

h2::before {
    content: "★ ";
}

h2::after {
    content: " ★";
}

</style>
</head>

<body>
<h3><mark>V.VijaySaiDattu|24K61A12C0</mark></h3>
<h2>Hello</h2>

<p>
This is an example of pseudo element selector.
It changes the first letter and first line.
</p>

</body>
</html>
