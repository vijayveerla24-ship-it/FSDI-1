<!DOCTYPE html>
<html>
<head>
    <title>Types of CSS</title>
    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- Internal CSS -->
    <style>
        h1 {
            color: blue;
            text-align: center;
        }

        p {
            font-size: 20px;
        }
    </style>

</head>

<body>

    <h1>Types of CSS</h1>

    <!-- Inline CSS -->
    <p style="color: red;">
        This is Inline CSS.
    </p>

    <p>
        This is Internal CSS.
    </p>

    <h2>
        This is External CSS.
    </h2>

<style>
h2 {
    color: green;
    text-align: center;
}
</style>
</body>
</html>
